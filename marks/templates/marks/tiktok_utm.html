{% extends "base.html" %}
{% block title %}UTM-ссылка #{{ funnel.id }}{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h2 class="mb-0">Рекламная UTM-ссылка</h2>
  <a class="btn btn-outline-secondary btn-sm" href="{% url 'tiktok_panel' %}">← Дев-панель</a>
</div>

<p class="text-muted">
  Воронка #{{ funnel.id }} · <code>{{ funnel.landing_endpoint }}</code>.
  <code>source/medium/term</code> — из воронки; <code>campaign/content/id</code> и <code>ttclid</code> — макросы TikTok.
</p>

<div class="input-group mb-2">
  <input id="utm-box" type="text" class="form-control" value="{{ url }}" readonly>
  <button class="btn btn-primary" onclick="copyUtm()">Скопировать</button>
</div>

<script>
function copyUtm() {
  var box = document.getElementById('utm-box');
  box.select();
  navigator.clipboard.writeText(box.value).then(function () {
    alert('Ссылка скопирована');
  });
}
</script>
{% endblock %}
